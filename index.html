<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hated Talents</title>
  <meta name="description" content="Human + machine. The signal continues.">
  <meta name="theme-color" content="#070708">
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: #070708;
      color: #e8e4dc;
    }
    body {
      min-height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Segoe UI", system-ui, sans-serif;
      padding: 2rem;
    }
    main { text-align: center; max-width: 28rem; }
    p {
      margin: 0;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      font-size: clamp(0.78rem, 2.4vw, 0.95rem);
    }
    .mark {
      display: inline-block;
      width: 0.45rem;
      height: 0.45rem;
      margin-right: 0.7rem;
      border-radius: 50%;
      background: #c23b4a;
      box-shadow: 0 0 12px #c23b4a;
      vertical-align: 0.08em;
    }
    .sub {
      margin-top: 1.1rem;
      letter-spacing: 0.28em;
      font-size: 0.68rem;
      color: #8d8794;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <main>
    <p><span class="mark" aria-hidden="true"></span>The signal continues.</p>
    <p class="sub">Hated Talents</p>
  </main>
</body>
</html>
